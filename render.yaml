services:
  - type: web
    name: page-to-screen
    runtime: python
    plan: starter # the free plan sleeps after 15 min idle; see README
    # Pre-warm the Wikidata cache at build time so the first request is instant.
    buildCommand: pip install -r requirements.txt && (python -m page_to_screen refresh || true)
    startCommand: uvicorn page_to_screen.asgi:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: P2S_CONTACT
        sync: false
