[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "page-to-screen"
version = "0.1.0"
description = "Stremio catalog addon: films adapted from books, sourced from Wikidata"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
page-to-screen = "page_to_screen.__main__:main"

[tool.setuptools]
packages = ["page_to_screen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
